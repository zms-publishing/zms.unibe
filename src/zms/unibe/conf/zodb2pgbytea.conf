# https://relstorage.readthedocs.io/en/latest/zodbconvert.html
# -> $ dev/.venv/bin/zodbconvert src/zms/unibe/conf/zodb2pgbytea.conf

# PLEASE NOTE: "zodbconvert" (for relstorage/pgbytea) is a separate CLI migration tool in addition to “zodb-convert” (for zodb/pgjsonb).

<filestorage source>
    path dev/zodb-filestorage/Data.fs.old
</filestorage>

<relstorage destination>
    <postgresql>
        dsn dbname='zodb_bytea' user='postgres' password='thisIsMyRoot' host='localhost'
    </postgresql>
</relstorage>
