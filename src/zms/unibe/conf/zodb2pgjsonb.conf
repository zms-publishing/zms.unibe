# https://bluedynamics.github.io/zodb-pgjsonb/how-to/migrate-with-zodbconvert.html
# -> $ dev/.venv/bin/zodb-convert -vv src/zms/unibe/conf/zodb2pgjsonb.conf

# PLEASE NOTE: "zodb-convert" (for zodb/pgjsonb) is a separate CLI migration tool in addition to “zodbconvert” (for relstorage/pgbytea).

%import zodb_pgjsonb

<filestorage source>
    path dev/zodb-filestorage/Data.fs.old
</filestorage>

<pgjsonb destination>
    dsn dbname='zodb_jsonb' user='postgres' password='thisIsMyRoot' host='localhost'
</pgjsonb>
