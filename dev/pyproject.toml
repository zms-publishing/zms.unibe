[project]
name = "zms-unibe-dev"
version = "2026.dev"
description = "Python-based Content Management for Science, Technology and Medicine for unibe.ch"
readme = "README.md"
authors = [
    { name = "UniBE, University of Bern, IT Services Department" }
]
requires-python = ">=3.13"
dependencies = [
    "zope",
    "zms",
    "zms-unibe[zope,msgraphapi,fastapi,rq,alembic,pydevd-pycharm]",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
# PREREQUISTES in ./dev
# -> git clone https://github.com/zopefoundation/Zope.git zope
# -> git clone https://github.com/zms-publishing/ZMS.git products-zms
zope = { path = "./zope", editable = true }  # see constraint-dependencies below
zms = { path = "./products-zms", editable = true }
zms-unibe = { path = "../", editable = true }

[tool.uv]
package = false  # do not expect this zms.unibe project as package -> https://docs.astral.sh/uv/reference/settings/#package
# CONSTRAINTS by Zope 6.x combined with the dependencies of zms.unibe
# so that the intended versions are used when running uv sync or uv lock
# -> .venv/bin/update-zope-constraints --version 6.1
# -> uv sync
# UPDATE DEPENDENCIES by running the following commands
# -> .venv/bin/update-zope-constraints --version master --ignore-uv-pip-freeze
# -> uv sync --upgrade
# -> .venv/bin/update-zope-constraints --version master
# -> uv sync --upgrade
