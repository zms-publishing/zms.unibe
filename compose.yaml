name: zms-unibe-dev

networks:
  worker:

services:
  zope:
    image: ghcr.io/idasm-unibe-ch/zms-unibe-dev-zope:local
    init: true
    pull_policy: never
    build:
      context: .
      dockerfile: ./Dockerfile.zope
    develop:
      # [BUG] develop.watch initial_sync: true does not fire at container start
      # https://github.com/docker/compose/issues/13725
      watch:
        - path: ./src
          target: /app/src
          action: sync+restart
          ignore:
            - zms/unibe/fastapi
          initial_sync: true
        - path: ./src/zms/unibe/conf/
          target: /app/dev/etc
          action: sync+restart
          initial_sync: true
        - path: ./dev/Zope/src
          target: /app/dev/Zope/src
          action: sync+restart
          initial_sync: true
        - path: ./dev/ZMS/Products/zms
          target: /app/dev/ZMS/Products/zms
          action: sync+restart
          initial_sync: true
    volumes:
      - ./dev/unibe-cms/Extensions:/app/dev/Extensions:rw
      - ./dev/unibe-cms-models/frontend/zms/models:/app/frontend/zms/models:rw
    environment:
      - PYTHONUNBUFFERED=true
      - RUN_MIGRATIONS=false
      - DEBUG_MODE=true
      - SQLDB_STORAGE=postgresql://postgres:thisIsMyRoot@postgresql:5432/cms_formulator  # TODO: https://github.com/idasm-unibe-ch/unibe-cms/issues/1360
      - ZODB_RELSTORAGE_DB_NAME=zodb
      - ZODB_RELSTORAGE_DB_USER=postgres
      - ZODB_RELSTORAGE_DB_PASSWORD=thisIsMyRoot
      - ZODB_RELSTORAGE_DB_HOST=postgresql
      - ZODB_CONF=${ZODB_CONF:-zodb-relstorage.conf}
      - ZEO_URL=zeo:8000
      - AGENDA_CATEGORIES_URL=http://zope:8080/unibe/agenda-categories.json
      - ZMS_ENABLE_MARKDOWN_RENDERING=true
      - ZMS_ENABLE_CSP_HEADERS=true
      - ZMS_UV_PACKAGE_MANAGER=true
    ports:
      - "8088:8080"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    depends_on:
      postgresql:
        condition: service_healthy
      memcached:
        condition: service_started
    networks:
      - worker
  
  fastapi:
    image: ghcr.io/idasm-unibe-ch/zms-unibe-dev-fastapi:local
    init: true
    pull_policy: never
    build:
      context: .
      dockerfile: ./Dockerfile.fastapi
    develop:
      # [BUG] develop.watch initial_sync: true does not fire at container start
      # https://github.com/docker/compose/issues/13725
      watch:
        - path: ./src
          target: /app/src
          action: sync+restart
          initial_sync: true
        - path: ./src/zms/unibe/conf/
          target: /app/dev/etc
          action: sync+restart
          initial_sync: true
        - path: ./dev/zope/src
          target: /app/dev/zope/src
          action: sync+restart
          initial_sync: true
        - path: ./dev/ZMS/Products/zms
          target: /app/dev/ZMS/Products/zms
          action: sync+restart
          initial_sync: true
    environment:
      - PYTHONUNBUFFERED=true
      - SQLDB_STORAGE=postgresql://postgres:thisIsMyRoot@postgresql:5432/unibeportal  # TODO: https://github.com/idasm-unibe-ch/unibe-cms/issues/1360
      - ZODB_STORAGE=zeo://zeo:8000?storage=main  # deprecated in favor of ZEO_URL -> zms/unibe/utils/zope/zope.conf
      - ZODB_RELSTORAGE_DB_NAME=zodb
      - ZODB_RELSTORAGE_DB_USER=postgres
      - ZODB_RELSTORAGE_DB_PASSWORD=thisIsMyRoot
      - ZODB_RELSTORAGE_DB_HOST=postgresql
      - ZODB_CONF=${ZODB_CONF:-zodb-relstorage.conf}
      - ZEO_URL=zeo:8000
      - ZMS_URL=http://zope:8080
      - API_V1=true
      - API_V3=true
      - API_RQ=true
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - FORWARDED_ALLOW_IPS=*
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAME=default
      - PORTAL_MASTER=/unibe/content
      - ZMS_UV_PACKAGE_MANAGER=true
    ports:
      - "5055:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - worker
  
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    networks:
      - worker

  memcached:
    image: memcached:1.6.9-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    ports:
      - "127.0.0.1:11211:11211"
    volumes:
      - ./dev/unibe-cms/var/log:/app/log
    networks:
      - worker

  postgresql:
    image: postgres:16.10
    init: true
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./dev/postgresql/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thisIsMyRoot
      POSTGRES_DB: postgres
    entrypoint: >
      sh -c "
      echo 'CREATE DATABASE zodb; CREATE DATABASE unibeportal; CREATE DATABASE cms_formulator;' > /docker-entrypoint-initdb.d/init.sql &&
      exec /usr/local/bin/docker-entrypoint.sh postgres
      "
    networks:
      - worker